<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBN - Registo de Cliente</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: url('Carpintaria.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: whitesmoke;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            margin: 20px 0;
        }

        .form-title {
            background: whitesmoke; 
            padding: 25px; 
            text-align: center; 
            border-bottom: 5px solid rgb(39, 38, 38); 
        }

        .form-title h1 {
            font-size: 1.4rem;
            color: #0f2f66;
        }

        .form-body { 
            padding: 30px; 
        }

        .grid-form { 
            display: grid; 
            grid-template-columns: 1fr 1fr;
            gap: 25px; 
        }

        .form-group { 
            margin-bottom: 18px; 
        }

        .form-group label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: bold; 
            font-size: 0.9rem; 
            color: #333;
        }

        .form-group input, 
        .form-group select {
            width: 100%; 
            padding: 12px; 
            border: 1px solid rgb(176, 176, 176); 
            border-radius: 6px; 
            background: white;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, 
        .form-group select:focus {
            border-color: #0056b3;
        }

        .radio-group { 
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .radio-group label {
            font-weight: normal;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-enviar { 
            border-radius: 8px;
            background-color: blue;
            color: white;
            display: block; 
            margin: 30px auto 0; 
            padding: 14px 50px; 
            font-size: 1rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-enviar:hover {
            background-color: #003d82;
            transform: translateY(-2px);
        }

   
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .grid-form { 
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .form-body {
                padding: 20px;
            }

            .form-title h1 {
                font-size: 1.1rem;
            }

            .btn-enviar {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-title">
            <h1>FORMULÁRIO DE REGISTO DE CLIENTE</h1>
        </div>
        
        <form class="form-body" id="formCliente">
            <div class="grid-form">
               
                <div>
                    <div class="form-group">
                        <label>Nome Completo</label>
                        <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                    </div>
                    <div class="form-group">
                        <label>Número / E-mail</label>
                        <input type="text" id="contacto" placeholder="Digite seu número ou e-mail" required>
                    </div>
                    <div class="form-group">
                        <label>Bairro</label>
                        <select id="bairro" required>
                            <option value="">Selecione o seu bairro</option>
                            <option value="Mathapue">Mathapue</option>
                            <option value="Bloco 1">Bloco 1</option>
                            <option value="Onthupaia">Onthupaia</option>
                            <option value="Juma">Juma</option>
                            <option value="Mocone">Mocone</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Sexo</label>
                        <div class="radio-group">
                            <label><input type="radio" name="sexo" value="Masculino" required> Masculino</label>
                            <label><input type="radio" name="sexo" value="Feminino" required> Feminino</label>
                        </div>
                    </div>
                </div>

              
                <div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="senha" placeholder="Insira sua senha" required>
                    </div>
                    <div class="form-group">
                        <label>Confirmar Senha</label>
                        <input type="password" id="confirmaSenha" placeholder="Confirme sua senha" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-enviar">Enviar Registo</button>
        </form>
    </div>

    <script>
       
        const formCliente = document.getElementById('formCliente');

        formCliente.addEventListener('submit', (e) => {
            e.preventDefault();

            const nome = document.getElementById('nome').value.trim();
            const senha = document.getElementById('senha').value;
            const confirmaSenha = document.getElementById('confirmaSenha').value;

            if (senha !== confirmaSenha) {
                alert("As senhas não coincidem! Por favor, verifique.");
                document.getElementById('confirmaSenha').focus();
                return;
            }

            alert(`Bem-vindo ao CBN, ${nome}! O seu registo foi concluído com sucesso.`);
            window.location.href = "pagina principal.html";
        });
    </script>
</body>
</html>
